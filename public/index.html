<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ======================================================================
//  DỮ LIỆU THIÊN VĂN (số liệu thật, tỷ lệ hiển thị nén theo luỹ thừa)
//  a: bán trục lớn (AU) | e: độ lệch tâm | i: nghiêng quỹ đạo (deg)
//  T: chu kỳ quy hoạch (ngày) | rot: chu kỳ tự quay (ngày)
//  tilt: nghiêng trục (deg) | r: bán kính hiển thị (đã nén tay)
//  info: dữ liệu NASA fact sheet (khối lượng = Trái Đất=1, nhiệt độ K, số moon)
//  Nguồn: NASA planetary fact sheet (kiến thức chuẩn, ghi để kiểm chứng)
// ======================================================================
//  M0 = mean anomaly tại epoch J2000 (JD 2451545.0) = L − ϖ (bảng JPL
//  "Approximate Positions of the Planets", độ chính xác ~vài phút cung)
//  om = longitude of perihelion ϖ | node = longitude of ascending node Ω (deg)
const PLANETS = [ // info: mass(×E), temp(K), moons, đường kính km
  { name:"Mercury", a:0.387, e:0.206, i:7.005, T:88,     rot:58.6, tilt:0.03, r:0.55, col:"#9c8f84", col2:"#6b615a", M0:174.795, om:77.457,  node:48.331,  info:{mass:0.055, temp:440, moons:0, dia:4879} },
  { name:"Venus",   a:0.723, e:0.007, i:3.395, T:225,    rot:-243, tilt:177.4,r:0.85, col:"#e8c78f", col2:"#b8945f", M0:50.416,  om:131.564, node:76.680,  info:{mass:0.815, temp:737, moons:0, dia:12104} },
  { name:"Earth",   a:1.000, e:0.017, i:0.0,   T:365.25, rot:1.0,  tilt:23.4, r:0.9,  col:"#5f8fd8", col2:"#3a5f9f", M0:357.527, om:102.937, node:-11.26,  info:{mass:1.0, temp:288, moons:1, dia:12756} },
  { name:"Mars",    a:1.524, e:0.093, i:1.850, T:687,    rot:1.03, tilt:25.2, r:0.68, col:"#d1704a", col2:"#94452c", M0:19.406,  om:336.041, node:49.559,  info:{mass:0.107, temp:210, moons:2, dia:6792} },
  { name:"Jupiter", a:5.203, e:0.048, i:1.303, T:4333,   rot:0.41, tilt:3.1,  r:2.4,  col:"#d8b088", col2:"#a87850", M0:19.668,  om:14.728,  node:100.474, info:{mass:317.8, temp:165, moons:95, dia:142984} },
  { name:"Saturn",  a:9.537, e:0.054, i:2.489, T:10759,  rot:0.44, tilt:26.7, r:2.05, col:"#e0c896", col2:"#b09860", M0:317.355, om:92.599,  node:113.662, info:{mass:95.2, temp:134, moons:146, dia:120536} },
  { name:"Uranus",  a:19.19, e:0.047, i:0.773, T:30687,  rot:-0.72,tilt:97.8, r:1.4,  col:"#9fdde8", col2:"#6ba8b8", M0:142.284, om:170.954, node:74.017,  info:{mass:14.5, temp:76, moons:28, dia:51118} },
  { name:"Neptune", a:30.07, e:0.009, i:1.770, T:60190,  rot:0.67, tilt:28.3, r:1.35, col:"#4a6fe0", col2:"#2a45a8", M0:259.916, om:44.964,  node:131.784, info:{mass:17.1, temp:72, moons:16, dia:49528} },
  // ---- Dwarf planets (IAU 2006): Pluto bị hạ bậc 24/8/2006 ----
  // Dwarf planets: phần tử J2000 xấp xỉ (JPL SBDB)
  { name:"Ceres",  a:2.77,  e:0.076, i:10.6, T:1682,   rot:0.38, tilt:4,    r:0.30, col:"#a8a29a", col2:"#7a756d", M0:95.99,  om:153.9,  node:80.3,  dwarf:true, info:{mass:0.00016, temp:168, moons:0, dia:940} },
  { name:"Pluto",   a:39.48, e:0.249, i:17.2, T:90560,  rot:-6.39, tilt:119.6,r:0.42, col:"#d8c0a8", col2:"#a08878", M0:14.53,  om:224.07, node:110.3, dwarf:true, info:{mass:0.0022, temp:44, moons:5, dia:2377} },
  { name:"Eris",    a:67.78, e:0.44,  i:44.2, T:203830, rot:15.8/24,tilt:78, r:0.40, col:"#cfd8dc", col2:"#9aa4ab", M0:205.99, om:187.35, node:35.95, dwarf:true, info:{mass:0.0027, temp:30, moons:1, dia:2326} },
];

// NÉN KHOẢNG CÁCH: d_scene = C * a^0.55 (Neptune chỉ ~6.6x Earth thay vì 30x)
const DIST_C = 11.0;
const distScale = a => DIST_C * Math.pow(a, 0.55);

// ======================================================================
//  SCENE / RENDERER / CAMERA / BLOOM
// ======================================================================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0016);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 46, 62);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 400;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.5, 0.12
);
composer.addPass(bloomPass);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// ======================================================================
//  MẶT TRỜI — shader noise granulation + corona Fresnel
// ======================================================================
const sunUniforms = { uTime: { value: 0 } };
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(3.2, 96, 96),
  new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: /* glsl */`
      varying vec3 vNormal; varying vec3 vPos; varying vec3 vViewDir;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vPos = position;
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      varying vec3 vNormal; varying vec3 vPos; varying vec3 vViewDir;
      // hash + value noise 3D + 3-octave FBM
      float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
      float noise(vec3 p){
        vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                       mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                       mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p){
        float v = 0.0, a = 0.5;
        for(int k = 0; k < 3; k++){ v += a * noise(p); p *= 2.1; a *= 0.5; }
        return v;
      }
      void main() {
        // granulation cuộn theo thời gian
        float g = fbm(vPos * 2.2 + vec3(uTime * 0.10, uTime * 0.06, -uTime * 0.08));
        float g2 = fbm(vPos * 5.5 - vec3(0.0, uTime * 0.15, uTime * 0.1));
        vec3 hot  = vec3(1.00, 0.92, 0.62);
        vec3 mid  = vec3(1.00, 0.62, 0.18);
        vec3 dark = vec3(0.85, 0.28, 0.04);
        vec3 col = mix(dark, mid, smoothstep(0.25, 0.6, g));
        col = mix(col, hot, smoothstep(0.55, 0.85, g * 0.7 + g2 * 0.4));
        // limb darkening: rìa tối hơn
        float limb = pow(max(dot(vNormal, vViewDir), 0.0), 0.55);
        col *= 0.55 + 0.65 * limb;
        gl_FragColor = vec4(col * 1.7, 1.0);   // >1 cho bloom ăn
      }
    `,
  })
);
scene.add(sun);

// corona Fresnel quanh Mặt Trời (BackSide)
const corona = new THREE.Mesh(
  new THREE.SphereGeometry(4.4, 64, 64),
  new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending,
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color(0xffa030) } },
    vertexShader: /* glsl */`
      varying vec3 vNormal; varying vec3 vViewDir;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying vec3 vNormal; varying vec3 vViewDir;
      void main() {
        float fres = pow(1.0 - abs(dot(vNormal, vViewDir)), 2.6);
        gl_FragColor = vec4(uColor * fres * 2.2, fres);
      }
    `,
  })
);
scene.add(corona);

// nguồn sáng duy nhất của cả hệ
scene.add(new THREE.PointLight(0xfff2dd, 3200, 0, 2));   // decay=2 vật lý
scene.add(new THREE.AmbientLight(0x1a2030, 0.55));       // ánh ambiental rất nhẹ

// ======================================================================
//  TEXTURE PROCEDURAL — canvas sọc + noise cho bề mặt hành tinh
// ======================================================================
function planetTexture(colHex, col2Hex, banded) {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext("2d");
  const c1 = new THREE.Color(colHex), c2 = new THREE.Color(col2Hex);
  // nền gradient dọc
  const grd = ctx.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#" + c2.getHexString());
  grd.addColorStop(0.5, "#" + c1.getHexString());
  grd.addColorStop(1, "#" + c2.getHexString());
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 512, 256);
  // seeded noise
  let s = 777;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  if (banded) {
    // hành tinh khí: sọc ngang jitter
    for (let y = 0; y < 256; y += 3) {
      if (rnd() < 0.55) continue;
      ctx.globalAlpha = 0.12 + rnd() * 0.25;
      ctx.fillStyle = rnd() < 0.5 ? "#" + c1.getHexString() : "#" + c2.getHexString();
      ctx.fillRect(0, y, 512, 2 + rnd() * 5);
    }
  } else {
    // hành tinh đá: vệt loang
    for (let k = 0; k < 900; k++) {
      ctx.globalAlpha = 0.05 + rnd() * 0.16;
      ctx.fillStyle = rnd() < 0.5 ? "#" + c1.getHexString() : "#" + c2.getHexString();
      const x = rnd() * 512, y = rnd() * 256, r = 2 + rnd() * 14;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, rnd() * 3.14, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ======================================================================
//  KEPLER — giải M = E - e*sinE (Newton-Raphson) -> vị trí ellipse
// ======================================================================
function solveKepler(M, e) {
  let E = M;
  for (let k = 0; k < 6; k++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
// Ephemeris thật: M(t) = M0(J2000) + 2π·(t − J2000)/T, với t = days từ J2000.
// Transform đầy đủ 3 góc: ω (trong mặt phẳng, = ϖ − Ω) -> nghiêng i quanh đường
// node -> xoay Ω quanh trục đứng (Y). Hệ scene: Y = lên, hoàng đạo = mặt XZ.
function orbitalPosition(p, days) {
  const M = (p.M0 * Math.PI / 180) + 2 * Math.PI * (days / p.T);   // rad
  const E = solveKepler(((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI), p.e);
  // tọa độ trong mặt phẳng quỹ đạo, perihelion hướng +X (tiêu điểm = Mặt Trời)
  const XP = p.a * (Math.cos(E) - p.e);
  const ZP = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
  const D = Math.PI / 180;
  const w = (p.om - p.node) * D;                 // argument of perihelion ω
  const inc = p.i * D;
  const om = p.node * D;
  // 1) quay trong mặt phẳng bởi ω
  const x1 = XP * Math.cos(w) - ZP * Math.sin(w);
  const z1 = XP * Math.sin(w) + ZP * Math.cos(w);
  // 2) nghiêng quỹ đạo i quanh trục X (đường node)
  const y2 = z1 * Math.sin(inc);
  const z2 = z1 * Math.cos(inc);
  // 3) xoay quanh trục đứng bởi Ω
  const x3 = x1 * Math.cos(om) + z2 * Math.sin(om);
  const z3 = -x1 * Math.sin(om) + z2 * Math.cos(om);
  // nén khoảng cách hiển thị (giữ hình dạng/hướng ellipse)
  const s = distScale(p.a) / p.a;
  return { x: x3 * s, y: y2 * s, z: z3 * s, r: Math.hypot(XP, ZP) };
}

// ======================================================================
//  DỰNG HÀNH TINH + ĐƯỜNG QUỸ ĐẠO
// ======================================================================
const GAS = new Set(["Jupiter", "Saturn", "Uranus", "Neptune"]);
const planetObjs = [];

// CSS2D renderer cho nhãn tên hành tinh
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.pointerEvents = "none";
document.body.appendChild(labelRenderer.domElement);

for (const p of PLANETS) {
  const grp = new THREE.Group();                    // nghiêng trục
  const spin = new THREE.Group();                   // tự quay
  grp.add(spin);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 48, 48),
    new THREE.MeshStandardMaterial({
      map: planetTexture(p.col, p.col2, GAS.has(p.name)),
      roughness: 0.85, metalness: 0.1,
    })
  );
  spin.add(mesh);
  grp.rotation.z = p.tilt * Math.PI / 180;          // nghiêng trục quay
  scene.add(grp);
  // nhãn tên (CSS2D, nhỏ hơn + mờ hơn cho dwarf planet)
  const lbl = document.createElement("div");
  lbl.textContent = p.name;   // đuôi dwarf do applyLang() bổ sung theo ngôn ngữ
  lbl.style.cssText = "font:11px ui-sans-serif; color:" +
    (p.dwarf ? "#7a95b5" : "#cfe2ff") + "; text-shadow:0 0 6px rgba(0,20,50,.9); pointer-events:none;";
  const lblObj = new CSS2DObject(lbl);
  lblObj.position.set(0, p.r + 0.5, 0);
  grp.add(lblObj);
  planetObjs.push({ data: p, grp, spin, mesh, lblObj });

  // đường quỹ đạo ellipse (mẫu quỹ đạo thật, có tính e + i)
  const pts = [];
  for (let k = 0; k <= 256; k++) {
    const pos = orbitalPosition(p, k / 256 * p.T);
    pts.push(new THREE.Vector3(pos.x, pos.y, pos.z));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x2a4a6a, transparent: true, opacity: 0.5 })
  );
  scene.add(line);
  p._orbitLine = line;
}

// ======================================================================
//  PHASE 2a: MOONS — mặt trăng cho Trái Đất / Jupiter / Saturn
// ======================================================================
let saturnRing = null;      // (khai báo trước để tránh TDZ)
let asteroidBelt = null;
let kuiperBelt = null;
const MOONS = [
  { parent: "Earth",   r: 0.24, dist: 1.7,  T: 27.3,  tilt: 0.09, col: 0x9a9a94 },
  { parent: "Jupiter", r: 0.18, dist: 3.4,  T: 1.77,  tilt: 0.03, col: 0xd8c078 },  // Io
  { parent: "Jupiter", r: 0.16, dist: 4.1,  T: 3.55,  tilt: 0.05, col: 0xc8b8a8 },  // Europa
  { parent: "Jupiter", r: 0.22, dist: 4.9,  T: 7.15,  tilt: 0.04, col: 0x8a7a68 },  // Ganymede
  { parent: "Jupiter", r: 0.19, dist: 5.8,  T: 16.7,  tilt: 0.06, col: 0xb8a890 },  // Callisto
  { parent: "Saturn",  r: 0.20, dist: 4.3,  T: 15.9,  tilt: 0.35, col: 0xd8b878 },  // Titan
];
const moonObjs = [];
for (const m of MOONS) {
  const host = planetObjs.find(o => o.data.name === m.parent);
  if (!host) continue;
  const pivot = new THREE.Group();
  pivot.rotation.x = m.tilt;                          // nghiêng mặt phẳng quỹ đạo moon
  const mm = new THREE.Mesh(
    new THREE.SphereGeometry(m.r, 24, 24),
    new THREE.MeshStandardMaterial({ color: m.col, roughness: 0.9, metalness: 0.05 })
  );
  mm.position.x = m.dist;
  pivot.add(mm);
  host.grp.add(pivot);                                // moon đi theo hành tinh mẹ
  moonObjs.push({ pivot, mm, T: m.T, host });
}

// ======================================================================
//  PHASE 2b: VÀNH SAO THỔ — particle Kepler (tái dùng kỹ thuật Saturn
//  rings: radial glow texture, AdditiveBlending, depthWrite false, khe Cassini)
// ======================================================================
function makeGlowTexture() {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, "rgba(255,255,255,1)");
  g.addColorStop(0.3, "rgba(255,255,255,0.6)");
  g.addColorStop(1.0, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
{
  const sat = planetObjs.find(o => o.data.name === "Saturn");
  if (sat) {
    const N = 9000;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const rAng = new Float32Array(N), rRad = new Float32Array(N), rOm = new Float32Array(N);
    let s = 20240923;
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    // vành: 3 dải có khe Cassini ở giữa, nén theo bán kính hành tinh r=2.05
    const bands = [[2.6, 3.3], [3.5, 4.2], [4.45, 5.1]];   // đơn vị scene
    const gold = new THREE.Color(0xd8c090), pale = new THREE.Color(0x8898a8);
    let idx = 0;
    for (let b = 0; b < bands.length; b++) {
      const [r0, r1] = bands[b];
      const nB = Math.floor(N * (b === 0 ? 0.38 : b === 1 ? 0.37 : 0.25));
      for (let k = 0; k < nB && idx < N; k++, idx++) {
        const u = rnd();
        const r = r0 + (r1 - r0) * (b === 0 ? Math.pow(u, 0.7) : u);  // dải trong dày
        const a = rnd() * 6.283;
        rRad[idx] = r; rAng[idx] = a;
        rOm[idx] = 1.6 / Math.sqrt(r);                                // Keplerian ω ∝ 1/√r
        pos[idx * 3] = Math.cos(a) * r;
        pos[idx * 3 + 1] = ((rnd() + rnd() + rnd()) / 3 - 0.5) * 0.12;  // mỏng
        pos[idx * 3 + 2] = Math.sin(a) * r;
        // màu: trong vàng kem, ngoài xám xanh băng
        const c = gold.clone().lerp(pale, (r - 2.6) / 2.5);
        const br = 0.5 + rnd() * 0.5;
        col[idx * 3] = c.r * br; col[idx * 3 + 1] = c.g * br; col[idx * 3 + 2] = c.b * br;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const ringPts = new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.09, map: makeGlowTexture(), vertexColors: true,
      transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending,
      depthWrite: false, sizeAttenuation: true,
    }));
    ringPts.rotation.x = 0.47;          // nghiêng vành theo trục Saturn 26.7°
    sat.grp.add(ringPts);
    // animate: đưa vào mảng cập nhật Keplerian quanh Saturn (trong hệ quy chiếu grp)
    saturnRing = { geo: g, ang: rAng, rad: rRad, om: rOm, n: idx };
  }
}

let cometUpdater = null;
let meteorUpdater = null;

// ======================================================================
//  SAO CHỖI — quỹ đạo ellipse lệch tâm cao (e=0.85), đuôi particle luôn
//  hướng ra xa Mặt Trời (đuôi ion vật lý thật)
// ======================================================================
{
  // quỹ đạo comet: a=18 AU, e=0.85 (như Halley e=0.967), nghiêng 25°
  const CA = 18, CE = 0.85, CT = 365.25 * Math.pow(18, 1.5);   // định luật III Kepler
  const cometHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xcfefff })
  );
  scene.add(cometHead);

  // đuôi: 900 hạt trail, mỗi hạt có tuổi — đầu mới sáng, đuôi cũ mờ
  const CN = 900;
  const cPos = new Float32Array(CN * 3), cCol = new Float32Array(CN * 3);
  const cAge = new Float32Array(CN);
  const cg = new THREE.BufferGeometry();
  cg.setAttribute("position", new THREE.BufferAttribute(cPos, 3));
  cg.setAttribute("color", new THREE.BufferAttribute(cCol, 3));
  const cometTail = new THREE.Points(cg, new THREE.PointsMaterial({
    size: 0.16, map: makeGlowTexture(), vertexColors: true,
    transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  }));
  scene.add(cometTail);

  // lưu hàm cập nhật để gọi trong animate
  cometUpdater = (days) => {
    // vị trí Kepler trên ellipse e=0.85
    const M = 2 * Math.PI * (days / CT);
    const E = solveKepler(((M % 6.283185) + 6.283185) % 6.283185, CE);
    const xO = CA * (Math.cos(E) - CE);
    const yO = CA * Math.sqrt(1 - CE * CE) * Math.sin(E);
    const s = distScale(CA) / CA;
    const inc = 25 * Math.PI / 180;
    const hx = xO * s, hy = yO * Math.cos(inc), hz = yO * Math.sin(inc);
    cometHead.position.set(hx, hy, hz);

    // hướng đuôi: ra xa Mặt Trời (0,0,0) — vector từ Mặt Trời qua đầu sao chổi
    const away = new THREE.Vector3(hx, hy, hz).normalize();
    // re-seed trail: mỗi frame dịch các hạt theo hướng 'away' + lệch ngẫu nhiên
    for (let i = CN - 1; i > 0; i--) {
      // hạt i kế thừa vị trí hạt i-1 + drift dọc 'away' (mở rộng đuôi)
      cAge[i] = cAge[i - 1] + 1;
    }
    // hạt 0 = đầu comet
    cPos[0] = hx; cPos[1] = hy; cPos[2] = hz; cAge[0] = 0;
    for (let i = 1; i < CN; i++) {
      const t = i / CN;
      const dist = t * 5.5;                                   // dài đuôi 5.5 units
      const wob = Math.sin(i * 0.15 + ST.days * 0.02) * 0.25 * t;  // lượn sóng nhẹ
      cPos[i * 3] = hx + away.x * dist + wob * 0.6;
      cPos[i * 3 + 1] = hy + away.y * dist + wob;
      cPos[i * 3 + 2] = hz + away.z * dist + wob * 0.4;
      const bright = (1 - t) * (0.5 + 0.5 * Math.sin(i * 0.05 + ST.days * 0.05));
      cCol[i * 3] = 0.75 * bright;                            // xanh băng
      cCol[i * 3 + 1] = 0.85 * bright;
      cCol[i * 3 + 2] = 1.0 * bright;
    }
    cg.attributes.position.needsUpdate = 1;
    cg.attributes.color.needsUpdate = 1;
  };
}

// ======================================================================
//  MƯA SAO BĂNG — vệt sáng ngẫu nhiên chéo qua cảnh, tái sinh định kỳ
// ======================================================================
{
  const MN = 40;                    // tối đa 40 meteor đồng thời
  const mPos = new Float32Array(MN * 6);   // LineSegments: 2 điểm/vệt
  const mCol = new Float32Array(MN * 6);
  const mg = new THREE.BufferGeometry();
  mg.setAttribute("position", new THREE.BufferAttribute(mPos, 3));
  mg.setAttribute("color", new THREE.BufferAttribute(mCol, 3));
  const meteors = new THREE.LineSegments(mg, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(meteors);
  // trạng thái từng meteor: active, pos, vel, life
  const mState = [];
  for (let i = 0; i < MN; i++) mState.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0 });
  let spawnTimer = 0.4;

  meteorUpdater = (dt, tSec) => {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      // kích hoạt 1 meteor tại vị trí ngẫu nhiên trong sphere bán kính 60
      const m = mState.find(x => !x.active);
      if (m) {
        m.active = true;
        m.pos.set((Math.random() - 0.5) * 90, 20 + Math.random() * 30, (Math.random() - 0.5) * 90);
        const dir = new THREE.Vector3(Math.random() - 0.5, -(0.4 + Math.random() * 0.4), Math.random() - 0.5).normalize();
        m.vel.copy(dir).multiplyScalar(55 + Math.random() * 35);     // 55-90 units/s
        m.life = 1.0;
      }
      spawnTimer = 0.25 + Math.random() * 0.8;      // spawn dày tạo cơn mưa
    }
    for (let i = 0; i < MN; i++) {
      const m = mState[i];
      if (!m.active) { mPos[i * 6 + 3] = 0; continue; }
      m.pos.addScaledVector(m.vel, dt);
      m.life -= dt * 0.7;
      if (m.life <= 0) { m.active = false; continue; }
      const tail = m.vel.clone().normalize().multiplyScalar(2.8);   // vệt dài 2.8
      mPos[i * 6] = m.pos.x; mPos[i * 6 + 1] = m.pos.y; mPos[i * 6 + 2] = m.pos.z;
      mPos[i * 6 + 3] = m.pos.x - tail.x;
      mPos[i * 6 + 4] = m.pos.y - tail.y;
      mPos[i * 6 + 5] = m.pos.z - tail.z;
      const br = Math.min(1, m.life) * 0.9;
      // màu: đầu trắng-vàng, đuôi mờ
      mCol[i * 6] = 1.0 * br; mCol[i * 6 + 1] = 0.95 * br; mCol[i * 6 + 2] = 0.8 * br;
      mCol[i * 6 + 3] = br * 0.1; mCol[i * 6 + 4] = br * 0.1; mCol[i * 6 + 5] = br * 0.15;
    }
    mg.attributes.position.needsUpdate = true;
    mg.attributes.color.needsUpdate = true;
  };
}

// ======================================================================
//  PHASE 2c: ASTEROID BELT — InstancedMesh giữa Mars–Jupiter
//  (logic Kepler per-asteroid, mượn ý tưởng KeplerParticles của spacekit)
// ======================================================================
{
  const N_AST = 3000;
  const rockGeo = new THREE.IcosahedronGeometry(0.05, 0);   // đá dăm đa diện
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a7f70, roughness: 0.95, metalness: 0.05 });
  const inst = new THREE.InstancedMesh(rockGeo, rockMat, N_AST);
  const astData = [];
  let s = 55555;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N_AST; i++) {
    // a giữa 2.1 - 3.3 AU (vành chính), e ngẫu nhiên nhỏ, i nghiêng nhẹ
    const a = 2.1 + rnd() * 1.2;
    const e = rnd() * 0.12;
    const inc = (rnd() - 0.5) * 0.15;
    const M0 = rnd() * 6.283;
    const T = 365.25 * Math.pow(a, 1.5);                  // định luật III Kepler
    const rotSpeed = rnd() * 2 - 1;
    const scl = 0.5 + rnd() * 1.6;
    astData.push({ a, e, inc, M0, T, rotSpeed, scl });
    dummy.scale.setScalar(scl);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  scene.add(inst);
  asteroidBelt = { inst, data: astData, dummy };
}

// ======================================================================
//  VÀNH ĐAI KUIPER — 8.000 thiên thể nhỏ 30–50 AU (ngoài Neptune),
//  vùng của Pluto/Eris. Points cho rẻ draw call, Kepler per-object,
//  nghiêng lan tỏa dày hơn mặt phẳng hoàng đạo (đúng đặc trưng Belt)
// ======================================================================
{
  const N_K = 8000;
  const kPos = new Float32Array(N_K * 3), kCol = new Float32Array(N_K * 3);
  const kData = [];
  let s = 733331;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const cIce = new THREE.Color(0x9fb8cc), cDim = new THREE.Color(0x4a5a6e);
  for (let i = 0; i < N_K; i++) {
    // a 32–48 AU, dày hơn gần biên trong (32–38 chiếm ~70%)
    const u = rnd();
    const a = u < 0.7 ? 32 + u / 0.7 * 6 : 38 + (u - 0.7) / 0.3 * 10;
    const e = rnd() * 0.12;
    const inc = (rnd() - 0.5) * 0.35;          // lan tỏa ±10° — dày hơn asteroid belt
    const M0 = rnd() * 6.283;
    const T = 365.25 * Math.pow(a, 1.5);       // định luật III Kepler
    kData.push({ a, e, inc, M0, T });
    const c = cIce.clone().lerp(cDim, rnd() * 0.8);
    const b = 0.35 + rnd() * 0.5;
    kCol[i * 3] = c.r * b; kCol[i * 3 + 1] = c.g * b; kCol[i * 3 + 2] = c.b * b;
  }
  const kg = new THREE.BufferGeometry();
  kg.setAttribute("position", new THREE.BufferAttribute(kPos, 3));
  kg.setAttribute("color", new THREE.BufferAttribute(kCol, 3));
  const kuiper = new THREE.Points(kg, new THREE.PointsMaterial({
    size: 0.11, map: makeGlowTexture(), vertexColors: true,
    transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  }));
  scene.add(kuiper);
  kuiperBelt = { geo: kg, data: kData, n: N_K };
}

// ======================================================================
//  SAO NỀN
// ======================================================================
{
  const n = 3500, sp = new Float32Array(n * 3), sc = new Float32Array(n * 3);
  let s = 31337;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < n; i++) {
    const r = 500 + rnd() * 700;
    const th = rnd() * 6.283, ph = Math.acos(2 * rnd() - 1);
    sp[i * 3] = r * Math.sin(ph) * Math.cos(th);
    sp[i * 3 + 1] = r * Math.cos(ph);
    sp[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    const b = 0.3 + rnd() * 0.7;
    sc[i * 3] = b; sc[i * 3 + 1] = b; sc[i * 3 + 2] = b * (0.9 + rnd() * 0.2);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  sg.setAttribute("color", new THREE.BufferAttribute(sc, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({
    size: 1.6, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false,
  })));
}

let audioCtx = null, ambientNodes = null;
$("ambient").addEventListener("click", () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (!ambientNodes) {
    // 3 oscillator detune nhẹ tạo drone pad + LFO điều biến gain cho "thở"
    const master = audioCtx.createGain();
    master.gain.value = 0;                     // fade-in bằng setTargetAtTime
    master.connect(audioCtx.destination);
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.07;                // chu kỳ thở ~14s
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    const oscs = [];
    [[55, "sine"], [110.5, "sine"], [164.8, "triangle"]].forEach(([f, type], i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.value = i === 2 ? 0.04 : 0.09;    // гармон higher nhỏ hơn
      o.connect(g); g.connect(master);
      o.start();
      oscs.push(o);
    });
    lfo.connect(oscs[0].frequency);            // vibrato nhẹ tầng nền
    lfo.start();
    master.gain.setTargetAtTime(0.22, audioCtx.currentTime, 1.5);   // fade-in 1.5s
    ambientNodes = { master, oscs, lfo };
  } else {
    const on = ambientNodes.master.gain.value > 0.01;
    ambientNodes.master.gain.setTargetAtTime(on ? 0 : 0.22, audioCtx.currentTime, 0.8);
  }
  const on = ambientNodes.master.gain.value > 0.01;
  $("ambient").textContent = T().audio(!on);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (!ST.paused) {
    const daysPerSec = Math.pow(10, ST.speedExp);
    ST.days += daysPerSec * dt;
    for (const o of planetObjs) {
      const pos = orbitalPosition(o.data, ST.days);
      o.grp.position.set(pos.x, pos.y, pos.z);
      // tự quay: rot = chu kỳ tự quay (ngày), âm = quay ngược (Venus, Uranus)
      o.spin.rotation.y = 2 * Math.PI * ST.days / o.data.rot;
    }
    sunUniforms.uTime.value = ST.days * 0.02;
    // hiển thị ngày/giờ lịch thực: days -> unix ms -> Date
    const dObj = new Date((ST.days + 2451545.0 - 2440587.5) * 86400000);
    $("date").textContent = dObj.toLocaleString("vi-VN", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  // ---- Phase 2: vành Saturn Keplerian (tính theo ngày mô phỏng, hệ quy chiếu grp) ----
  if (saturnRing) {
    const pos = saturnRing.geo.attributes.position.array;
    for (let i = 0; i < saturnRing.n; i++) {
      // ω đã là rad/ngày-không-gian-thực: quy từ chu kỳ vật lý ~ 0.6 ngày/vòng tại r=2.6
      saturnRing.ang[i] += saturnRing.om[i] * 0.35 * (ST.paused ? 0 : 1);
      const a = saturnRing.ang[i], r = saturnRing.rad[i];
      pos[i * 3] = Math.cos(a) * r;
      pos[i * 3 + 2] = Math.sin(a) * r;
    }
    saturnRing.geo.attributes.position.needsUpdate = true;
  }

  // ---- Phase 2: asteroid belt — vị trí Kepler per-asteroid ----
  if (asteroidBelt && !ST.paused) {
    const { inst, data, dummy } = asteroidBelt;
    for (let i = 0; i < data.length; i++) {
      const d = data[i];
      const M = 2 * Math.PI * (ST.days / d.T) + d.M0;
      const E = solveKepler(((M % 6.283185) + 6.283185) % 6.283185, d.e);
      const xO = d.a * (Math.cos(E) - d.e);
      const yO = d.a * Math.sqrt(1 - d.e * d.e) * Math.sin(E);
      const s = distScale(d.a) / d.a;
      dummy.position.set(xO * s, yO * Math.cos(d.inc), yO * Math.sin(d.inc));
      dummy.rotation.set(d.M0 + ST.days * d.rotSpeed * 0.01, d.M0 * 2, 0);
      dummy.scale.setScalar(d.scl);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  }

  controls.update();

  // ---- Phase 3: camera bám hành tinh theo delta (không set cứng) ----
  if (followTarget) {
    const p = followTarget.grp.position;
    // giữ khoảng cách hiện tại, chỉ dịch target + camera cùng delta vị trí hành tinh
    const delta = p.clone().sub(controls.target);
    controls.target.add(delta);
    camera.position.add(delta);
  }
  // ---- Tour tự động: camera bay giữa các hành tinh ----
  if (ST.tourOn && planetObjs.length) {
    const target = planetObjs[ST.tourIdx % planetObjs.length];
    const p = target.grp.position;
    // điểm ngắm: lệch lên và ra ngoài hành tinh một khoảng theo bán kính hiển thị
    const offset = target.data.r * 6 + 2.5;
    const desired = new THREE.Vector3(p.x + offset, p.y + offset * 0.55, p.z + offset * 0.8);
    ST.tourTimer += dt;
    if (ST.tourPhase === "approach") {
      // lerp mượt theo exp-decay — tốc độ không phụ thuộc framerate
      camera.position.lerp(desired, 1 - Math.exp(-1.6 * dt));
      controls.target.lerp(p, 1 - Math.exp(-2.2 * dt));
      if (camera.position.distanceTo(desired) < 0.6 && ST.tourTimer > 2.2) {
        ST.tourPhase = "dwell"; ST.tourTimer = 0;
      }
    } else {   // dwell: đứng xem hành tinh 4s (vẫn bám theo khi nó di chuyển)
      camera.position.lerp(desired, 1 - Math.exp(-0.5 * dt));
      controls.target.lerp(p, 1 - Math.exp(-0.8 * dt));
      if (ST.tourTimer > 4.0) {
        ST.tourIdx = (ST.tourIdx + 1) % planetObjs.length;
        ST.tourPhase = "approach"; ST.tourTimer = 0;
      }
    }
  }

  // ---- Vành đai Kuiper: vị trí Kepler per-object ----
  if (kuiperBelt && !ST.paused) {
    const pos = kuiperBelt.geo.attributes.position.array;
    for (let i = 0; i < kuiperBelt.n; i++) {
      const d = kuiperBelt.data[i];
      const M = d.M0 + 2 * Math.PI * (ST.days / d.T);
      const E = solveKepler(((M % 6.283185) + 6.283185) % 6.283185, d.e);
      const xO = d.a * (Math.cos(E) - d.e);
      const yO = d.a * Math.sqrt(1 - d.e * d.e) * Math.sin(E);
      const s = distScale(d.a) / d.a;
      pos[i * 3] = xO * s;
      pos[i * 3 + 1] = yO * Math.cos(d.inc) * s;
      pos[i * 3 + 2] = yO * Math.sin(d.inc) * s;
    }
    kuiperBelt.geo.attributes.position.needsUpdate = true;
  }

  // ---- Sao chổi + mưa sao băng ----
  if (cometUpdater) cometUpdater(ST.days);
  if (meteorUpdater) meteorUpdater(dt, clock.elapsedTime);

  // ---- fade nhãn theo khoảng cách camera: gần hiện rõ, xa mờ dần, rất xa ẩn ----
  const camDist = camera.position.distanceTo(controls.target);
  for (const o of planetObjs) {
    if (!ST.showLabels) break;
    const d = camera.position.distanceTo(o.grp.position);
    // visible trong 260 đơn vị, fade 160->260, ngoài ẩn (tiết kiệm render)
    const opacity = Math.max(0, Math.min(1, (260 - d) / 100));
    o.lblObj.visible = opacity > 0.02;
    if (o.lblObj.visible) o.lblObj.element.style.opacity = opacity.toFixed(2);
  }

  composer.render();
  labelRenderer.render(scene, camera);          // Phase 3.5: nhãn CSS2D
}
animate();
applyLang();   // khởi tạo ngôn ngữ từ localStorage
</script>
</body>
</html>
