# lớp phòng thủ thứ hai song song với rate-limit app [F3]
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # G3: security headers (CSP + nosniff...) trong security-headers.conf —
    # phải include cả trong location có add_header riêng (nginx huỷ kế thừa).

    # API backend (self-host only — không tồn tại trên GitHub Pages)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # .mjs phải trả application/javascript — ES module bắt buộc MIME đúng
    # (mặc định mime.types của nginx không khai báo .mjs)
    # G4f: service worker luôn revalidate — trình duyệt phải biết ngay khi
    # bản SW mới (thắng location regex \.js$ phía dưới)
    location = /sw.mjs {
        default_type application/javascript;   # MIME đúng cho SW script
        include /etc/nginx/conf.d/security-headers.conf;   # add_header trong location huỷ kế thừa
        add_header Cache-Control "no-cache";
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        include /etc/nginx/conf.d/security-headers.conf;   # add_header trong location huỷ kế thừa
        # JS đổi nội dung mà không đổi tên (không hash filename) → KHÔNG được
        # immutable. no-cache = revalidate qua ETag, 304 gần như miễn phí.
        add_header Cache-Control "no-cache";
    }

    # cache tài nguyên tĩnh (ảnh/font — js|mjs|css đã tách riêng ở trên), HTML luôn mới
    location ~* \.(js|css|png|jpg|webp|woff2)$ {
        include /etc/nginx/conf.d/security-headers.conf;   # add_header trong location huỷ kế thừa
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        include /etc/nginx/conf.d/security-headers.conf;   # add_header trong location huỷ kế thừa
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # nén trước khi gửi — quan trọng cho file Three.js lớn
    gzip on;
    gzip_static on;   # phục vụ .gz nếu có — tiết kiệm CPU nginx
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

}
