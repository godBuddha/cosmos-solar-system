# lớp phòng thủ thứ hai song song với rate-limit app [F3]
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API backend (self-host only — không tồn tại trên GitHub Pages)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # cache tài nguyên tĩnh, HTML luôn mới
    location ~* \.(js|css|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # nén trước khi gửi — quan trọng cho file Three.js lớn
    gzip on;
    gzip_static on;   # phục vụ .gz nếu có — tiết kiệm CPU nginx
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # security headers cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
