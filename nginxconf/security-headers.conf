# G3: các security headers dùng chung — include ở server block VÀ mọi
# location có add_header riêng (add_header trong location huỷ kế thừa).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-+w7eSqayIAQVKGAUnV2AvotU0dQyqX54c8ohT1F2wMA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; font-src 'self'; media-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
