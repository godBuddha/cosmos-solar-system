# =====================================================================
#  COSMOS — Solar System 3D (Three.js) — self-hosted stack
#  docker compose up -d --build
# =====================================================================
services:
  cosmos:
    build: .
    image: cosmos-web:latest
    container_name: cosmos-web
    restart: unless-stopped
    ports:
      - "8090:80"           # đổi cổng tùy ý
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]   # IPv4, tránh false-unhealthy do IPv6
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webnet

