# =====================================================================
#  COSMOS — Solar System 3D (Three.js) — self-hosted stack
#  App static + API server (auth + AI gateway)
#  docker compose up -d --build
# =====================================================================
services:
  cosmos:
    build: .
    image: cosmos-web:latest
    container_name: cosmos-web
    restart: unless-stopped
    ports:
      - "8090:80"           # đổi cổng tùy ý
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webnet

  api:
    build: ./server
    image: cosmos-api:latest
    container_name: cosmos-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-doi-chuoi-nay-di}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
    volumes:
      - api_data:/app/data
    networks:
      - webnet

