<style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ======================================================================
//  DỮ LIỆU THIÊN VĂN (số liệu thật, tỷ lệ hiển thị nén theo luỹ thừa)
//  a: bán trục lớn (AU) | e: độ lệch tâm | i: nghiêng quỹ đạo (deg)
//  T: chu kỳ quy hoạch (ngày) | rot: chu kỳ tự quay (ngày)
//  tilt: nghiêng trục (deg) | r: bán kính hiển thị (đã nén tay)
//  info: dữ liệu NASA fact sheet (khối lượng = Trái Đất=1, nhiệt độ K, số moon)
//  Nguồn: NASA planetary fact sheet (kiến thức chuẩn, ghi để kiểm chứng)
// ======================================================================
//  M0 = mean anomaly tại epoch J2000 (JD 2451545.0) = L − ϖ (bảng JPL
//  "Approximate Positions of the Planets", độ chính xác ~vài phút cung)
//  om = longitude of perihelion ϖ | node = longitude of ascending node Ω (deg)
// Bảng PLANETS nạp từ catalog.json (sinh từ docs/bodies/*.md — single
// source of truth). Fallback hard-code giữ cho app chạy khi fetch fail.
const PLANETS_FALLBACK = [
  { name:"Mercury", a:0.387, e:0.206, i:7.005, T:88,     rot:58.6, tilt:0.03, r:0.55, col:"#9c8f84", col2:"#6b615a", M0:174.795, om:77.457,  node:48.331,  info:{mass:0.055, temp:440, moons:0, dia:4879} },
  { name:"Venus",   a:0.723, e:0.007, i:3.395, T:225,    rot:-243, tilt:177.4,r:0.85, col:"#e8c78f", col2:"#b8945f", M0:50.416,  om:131.564, node:76.680,  info:{mass:0.815, temp:737, moons:0, dia:12104} },
  { name:"Earth",   a:1.000, e:0.017, i:0.0,   T:365.25, rot:1.0,  tilt:23.4, r:0.9,  col:"#5f8fd8", col2:"#3a5f9f", M0:357.527, om:102.937, node:-11.26,  info:{mass:1.0, temp:288, moons:1, dia:12756} },
  { name:"Mars",    a:1.524, e:0.093, i:1.850, T:687,    rot:1.03, tilt:25.2, r:0.68, col:"#d1704a", col2:"#94452c", M0:19.406,  om:336.041, node:49.559,  info:{mass:0.107, temp:210, moons:2, dia:6792} },
  { name:"Jupiter", a:5.203, e:0.048, i:1.303, T:4333,   rot:0.41, tilt:3.1,  r:2.4,  col:"#d8b088", col2:"#a87850", M0:19.668,  om:14.728,  node:100.474, info:{mass:317.8, temp:165, moons:95, dia:142984} },
  { name:"Saturn",  a:9.537, e:0.054, i:2.489, T:10759,  rot:0.44, tilt:26.7, r:2.05, col:"#e0c896", col2:"#b09860", M0:317.355, om:92.599,  node:113.662, info:{mass:95.2, temp:134, moons:146, dia:120536} },
  { name:"Uranus",  a:19.19, e:0.047, i:0.773, T:30687,  rot:-0.72,tilt:97.8, r:1.4,  col:"#9fdde8", col2:"#6ba8b8", M0:142.284, om:170.954, node:74.017,  info:{mass:14.5, temp:76, moons:28, dia:51118} },
  { name:"Neptune", a:30.07, e:0.009, i:1.770, T:60190,  rot:0.67, tilt:28.3, r:1.35, col:"#4a6fe0", col2:"#2a45a8", M0:259.916, om:44.964,  node:131.784, info:{mass:17.1, temp:72, moons:16, dia:49528} },
  { name:"Ceres",  a:2.77,  e:0.076, i:10.6, T:1682,   rot:0.38, tilt:4,    r:0.30, col:"#a8a29a", col2:"#7a756d", M0:95.99,  om:153.9,  node:80.3,  dwarf:true, info:{mass:0.00016, temp:168, moons:0, dia:940} },
  { name:"Pluto",   a:39.48, e:0.249, i:17.2, T:90560,  rot:-6.39, tilt:119.6,r:0.42, col:"#d8c0a8", col2:"#a08878", M0:14.53,  om:224.07, node:110.3, dwarf:true, info:{mass:0.0022, temp:44, moons:5, dia:2377} },
  { name:"Eris",    a:67.78, e:0.44,  i:44.2, T:203830, rot:15.8/24,tilt:78, r:0.40, col:"#cfd8dc", col2:"#9aa4ab", M0:205.99, om:187.35, node:35.95, dwarf:true, info:{mass:0.0027, temp:30, moons:1, dia:2326} },
];
let PLANETS = [...PLANETS_FALLBACK];   // sẽ bị thay nếu fetch catalog thành công
let CATALOG_DESC = {};   // mô tả đa ngôn ngữ theo id, từ catalog

// nạp catalog — PHẢI hoàn tất trước khi dựng scene (có await ngay dưới)
async function loadCatalog() {
  try {
    const res = await fetch("./data/catalog.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const cat = await res.json();
    PLANETS = cat.map(b => ({
      name: b.names.en,                       // key nội bộ giữ EN (map qua I18N.names)
      a: b.a, e: b.e, i: b.i, T: b.T, rot: b.rot, tilt: b.tilt, r: b.r,
      col: b.col, col2: b.col2, M0: b.M0, om: b.om, node: b.node,
      dwarf: !!b.dwarf,
      info: { mass: b.mass, temp: b.temp, moons: b.moons, dia: b.dia },
    }));
    for (const b of cat) CATALOG_DESC[b.id] = b.desc;
    console.info("catalog loaded:", PLANETS.length, "bodies");
  } catch (e) {
    console.warn("catalog fetch fail — dùng fallback hard-code:", e.message);
  }
}
await loadCatalog();

// NÉN KHOẢNG CÁCH: d_scene = C * a^0.55 (Neptune chỉ ~6.6x Earth thay vì 30x)
const DIST_C = 11.0;
const distScale = a => DIST_C * Math.pow(a, 0.55);

// ======================================================================
//  SCENE / RENDERER / CAMERA / BLOOM
// ======================================================================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0016);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 46, 62);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 400;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.5, 0.12
);
composer.addPass(bloomPass);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// ======================================================================
//  MẶT TRỜI — shader noise granulation + corona Fresnel
// ======================================================================
const sunUniforms = { uTime: { value: 0 } };
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(3.2, 96, 96),
  new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: /* glsl */`
      varying vec3 vNormal; varying vec3 vPos; varying vec3 vViewDir;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vPos = position;
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      varying vec3 vNormal; varying vec3 vPos; varying vec3 vViewDir;
      // hash + value noise 3D + 3-octave FBM
      float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
      float noise(vec3 p){
        vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                       mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                       mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p){
        float v = 0.0, a = 0.5;
        for(int k = 0; k < 3; k++){ v += a * noise(p); p *= 2.1; a *= 0.5; }
        return v;
      }
      void main() {
        // granulation cuộn theo thời gian
        float g = fbm(vPos * 2.2 + vec3(uTime * 0.10, uTime * 0.06, -uTime * 0.08));
        float g2 = fbm(vPos * 5.5 - vec3(0.0, uTime * 0.15, uTime * 0.1));
        vec3 hot  = vec3(1.00, 0.92, 0.62);
        vec3 mid  = vec3(1.00, 0.62, 0.18);
        vec3 dark = vec3(0.85, 0.28, 0.04);
        vec3 col = mix(dark, mid, smoothstep(0.25, 0.6, g));
        col = mix(col, hot, smoothstep(0.55, 0.85, g * 0.7 + g2 * 0.4));
        // limb darkening: rìa tối hơn

// ======================================================================
//  TEXTURE PROCEDURAL — canvas sọc + noise cho bề mặt hành tinh
// ======================================================================
function planetTexture(colHex, col2Hex, banded) {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext("2d");
  const c1 = new THREE.Color(colHex), c2 = new THREE.Color(col2Hex);
  // nền gradient dọc
  const grd = ctx.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#" + c2.getHexString());
  grd.addColorStop(0.5, "#" + c1.getHexString());
  grd.addColorStop(1, "#" + c2.getHexString());
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 512, 256);
  // seeded noise
  let s = 777;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  if (banded) {
    // hành tinh khí: sọc ngang jitter
    for (let y = 0; y < 256; y += 3) {
      if (rnd() < 0.55) continue;
      ctx.globalAlpha = 0.12 + rnd() * 0.25;
      ctx.fillStyle = rnd() < 0.5 ? "#" + c1.getHexString() : "#" + c2.getHexString();
      ctx.fillRect(0, y, 512, 2 + rnd() * 5);
    }
  } else {
    // hành tinh đá: vệt loang
    for (let k = 0; k < 900; k++) {
      ctx.globalAlpha = 0.05 + rnd() * 0.16;
      ctx.fillStyle = rnd() < 0.5 ? "#" + c1.getHexString() : "#" + c2.getHexString();
      const x = rnd() * 512, y = rnd() * 256, r = 2 + rnd() * 14;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, rnd() * 3.14, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ======================================================================
//  KEPLER — giải M = E - e*sinE (Newton-Raphson) -> vị trí ellipse
// ======================================================================
function solveKepler(M, e) {
  let E = M;
  for (let k = 0; k < 6; k++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
// Ephemeris thật: M(t) = M0(J2000) + 2π·(t − J2000)/T, với t = days từ J2000.
// Transform đầy đủ 3 góc: ω (trong mặt phẳng, = ϖ − Ω) -> nghiêng i quanh đường
// node -> xoay Ω quanh trục đứng (Y). Hệ scene: Y = lên, hoàng đạo = mặt XZ.
function orbitalPosition(p, days) {
  const M = (p.M0 * Math.PI / 180) + 2 * Math.PI * (days / p.T);   // rad
  const E = solveKepler(((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI), p.e);
  // tọa độ trong mặt phẳng quỹ đạo, perihelion hướng +X (tiêu điểm = Mặt Trời)
  const XP = p.a * (Math.cos(E) - p.e);
  const ZP = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
  const D = Math.PI / 180;
  const w = (p.om - p.node) * D;                 // argument of perihelion ω
  const inc = p.i * D;
  const om = p.node * D;
  // 1) quay trong mặt phẳng bởi ω
  const x1 = XP * Math.cos(w) - ZP * Math.sin(w);
  const z1 = XP * Math.sin(w) + ZP * Math.cos(w);
  // 2) nghiêng quỹ đạo i quanh trục X (đường node)
  const y2 = z1 * Math.sin(inc);
  const z2 = z1 * Math.cos(inc);
  // 3) xoay quanh trục đứng bởi Ω
  const x3 = x1 * Math.cos(om) + z2 * Math.sin(om);
  const z3 = -x1 * Math.sin(om) + z2 * Math.cos(om);
  // nén khoảng cách hiển thị (giữ hình dạng/hướng ellipse)
  const s = distScale(p.a) / p.a;
  return { x: x3 * s, y: y2 * s, z: z3 * s, r: Math.hypot(XP, ZP) };
}

  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);

  g.addColorStop(0.3, "rgba(255,255,255,0.6)");
  g.addColorStop(1.0, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);

}
{

    const N = 9000;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const rAng = new Float32Array(N), rRad = new Float32Array(N), rOm = new Float32Array(N);
    let s = 20240923;
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    // vành: 3 dải có khe Cassini ở giữa, nén theo bán kính hành tinh r=2.05
    const bands = [[2.6, 3.3], [3.5, 4.2], [4.45, 5.1]];   // đơn vị scene
    const gold = new THREE.Color(0xd8c090), pale = new THREE.Color(0x8898a8);
    let idx = 0;
    for (let b = 0; b < bands.length; b++) {
      const [r0, r1] = bands[b];
      const nB = Math.floor(N * (b === 0 ? 0.38 : b === 1 ? 0.37 : 0.25));
      for (let k = 0; k < nB && idx < N; k++, idx++) {
        const u = rnd();
        const r = r0 + (r1 - r0) * (b === 0 ? Math.pow(u, 0.7) : u);  // dải trong dày
        const a = rnd() * 6.283;
        rRad[idx] = r; rAng[idx] = a;
        rOm[idx] = 1.6 / Math.sqrt(r);                                // Keplerian ω ∝ 1/√r
        pos[idx * 3] = Math.cos(a) * r;
        pos[idx * 3 + 1] = ((rnd() + rnd() + rnd()) / 3 - 0.5) * 0.12;  // mỏng
        pos[idx * 3 + 2] = Math.sin(a) * r;
        // màu: trong vàng kem, ngoài xám xanh băng
        const c = gold.clone().lerp(pale, (r - 2.6) / 2.5);
        const br = 0.5 + rnd() * 0.5;
        col[idx * 3] = c.r * br; col[idx * 3 + 1] = c.g * br; col[idx * 3 + 2] = c.b * br;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    // GPU-side Kepler: góc quay tính trong vertex shader, CPU chỉ set uDays
    g.setAttribute("aR", new THREE.BufferAttribute(rRad, 1));
    g.setAttribute("aOm", new THREE.BufferAttribute(rOm, 1));
    const ringMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uDays: { value: 0 }, uMap: { value: makeGlowTexture() }, uSize: { value: 0.09 } },
      vertexShader: /* glsl */`
        attribute float aR, aOm;

        uniform float uDays, uSize;

        void main() {
          // quay quanh Y trong hệ quy chiếu của Saturn (grp), omega du 1/sqrt(r)
          float a = aOm * uDays * 0.35;

          vec4 mv = modelViewMatrix * vec4(p, 1.0);

          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D uMap;
        varying vec3 vCol;
        void main() {
          vec4 tex = texture2D(uMap, gl_PointCoord);
          gl_FragColor = vec4(vCol, 1.0) * tex;

      `,
    });
    const ringPts = new THREE.Points(g, ringMat);
    ringPts.rotation.x = 0.47;          // nghiêng vành theo trục Saturn 26.7°
    sat.grp.add(ringPts);
    saturnRing = { mat: ringMat, n: idx };
  }
}

    uniforms: { uDays: { value: 0 }, uMap: { value: makeGlowTexture() }, uSize: { value: 0.13 } },
    vertexShader: /* glsl */`
      attribute float aA, aE, aI, aM, aT;
      attribute vec3 color;
      uniform float uDays, uSize;
      varying vec3 vCol;
      float solveK(float M, float e) {
        float E = M;
        for (int k = 0; k < 5; k++) E = E - (E - e * sin(E) - M) / (1.0 - e * cos(E));
        return E;
      }
      void main() {
        float M = aM + 6.283185 * (uDays / aT);
        M = mod(mod(M, 6.283185) + 6.283185, 6.283185);
        float E = solveK(M, aE);
        float sc = 11.0 * pow(aA, 0.55) / aA;
        vec3 p;
        p.x = aA * (cos(E) - aE) * sc;
        float yO = aA * sqrt(1.0 - aE * aE) * sin(E) * sc;
        p.y = yO * cos(aI);
        p.z = yO * sin(aI);
        vCol = color;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uSize * (240.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uMap;
      varying vec3 vCol;
      void main() {
        vec4 tex = texture2D(uMap, gl_PointCoord);
        gl_FragColor = vec4(vCol, 1.0) * tex;
      }
    `,
  });
  const belt = new THREE.Points(ag, aMat);
  scene.add(belt);
  asteroidBelt = { mat: aMat, n: N_AST };
}

// ======================================================================
//  VÀNH ĐAI KUIPER — 50.000 thiên thể nhỏ 32–48 AU (ngoài Neptune),
//  vùng của Pluto/Eris. Points cho rẻ draw call, Kepler per-object,
//  nghiêng lan tỏa dày hơn mặt phẳng hoàng đạo (đúng đặc trưng Belt)
// ======================================================================
{
  const N_K = parseInt(localStorage.getItem("cosmos_settings")
    ? (JSON.parse(localStorage.getItem("cosmos_settings")).kuiper ?? "50000")
    : "50000", 10);
  const kPos = new Float32Array(N_K * 3), kCol = new Float32Array(N_K * 3);
  const kData = [];
  let s = 733331;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const cIce = new THREE.Color(0x9fb8cc), cDim = new THREE.Color(0x4a5a6e);
  for (let i = 0; i < N_K; i++) {
    // a 32–48 AU, dày hơn gần biên trong (32–38 chiếm ~70%)
    const u = rnd();
    const a = u < 0.7 ? 32 + u / 0.7 * 6 : 38 + (u - 0.7) / 0.3 * 10;
    const e = rnd() * 0.12;
    const inc = (rnd() - 0.5) * 0.35;          // lan tỏa ±10° — dày hơn asteroid belt
    const M0 = rnd() * 6.283;
    const T = 365.25 * Math.pow(a, 1.5);       // định luật III Kepler
    kData.push({ a, e, inc, M0, T });
    const c = cIce.clone().lerp(cDim, rnd() * 0.8);
    const b = 0.35 + rnd() * 0.5;
    kCol[i * 3] = c.r * b; kCol[i * 3 + 1] = c.g * b; kCol[i * 3 + 2] = c.b * b;
  }
  const kg = new THREE.BufferGeometry();
  kg.setAttribute("position", new THREE.BufferAttribute(kPos, 3));
  kg.setAttribute("color", new THREE.BufferAttribute(kCol, 3));
  // attributes cho GPU-side Kepler: tính vị trí trong vertex shader
  // (CPU chỉ set uDays — không còn vòng lặp 8000 hạt mỗi frame)
  const kA = new Float32Array(N_K), kE = new Float32Array(N_K),
        kI = new Float32Array(N_K), kM = new Float32Array(N_K), kT = new Float32Array(N_K);
  for (let i = 0; i < N_K; i++) {
    kA[i] = kData[i].a; kE[i] = kData[i].e; kI[i] = kData[i].inc;
    kM[i] = kData[i].M0; kT[i] = kData[i].T;
  }
  kg.setAttribute("aA", new THREE.BufferAttribute(kA, 1));
  kg.setAttribute("aE", new THREE.BufferAttribute(kE, 1));
  kg.setAttribute("aI", new THREE.BufferAttribute(kI, 1));
  kg.setAttribute("aM", new THREE.BufferAttribute(kM, 1));
  kg.setAttribute("aT", new THREE.BufferAttribute(kT, 1));
  // nén scale theo a (distScale) tính sẵn vào aA để shader đơn giản
  const kMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uDays: { value: 0 },
      uMap:  { value: makeGlowTexture() },
      uSize: { value: 0.11 },
    },
    vertexShader: /* glsl */`
      attribute float aA, aE, aI, aM, aT;
      attribute vec3 color;
      uniform float uDays, uSize;
      varying vec3 vColor2;
      varying vec3 vCol;
      // Newton-Raphson giải M = E - e*sin(E) ngay trên GPU
      float solveK(float M, float e) {
        float E = M;
        for (int k = 0; k < 5; k++) E = E - (E - e * sin(E) - M) / (1.0 - e * cos(E));
        return E;
      }
      void main() {
        float M = aM + 6.283185 * (uDays / aT);
        M = mod(mod(M, 6.283185) + 6.283185, 6.283185);
        float E = solveK(M, aE);
        float sc = 11.0 * pow(aA, 0.55) / aA;           // distScale nén sẵn
        vec3 p;
        p.x = aA * (cos(E) - aE) * sc;
        float yO = aA * sqrt(1.0 - aE * aE) * sin(E) * sc;
        p.y = yO * cos(aI);
        p.z = yO * sin(aI);
        vCol = color;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uSize * (240.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uMap;
      varying vec3 vCol;
      void main() {
        vec4 tex = texture2D(uMap, gl_PointCoord);
        gl_FragColor = vec4(vCol, 1.0) * tex;
      }
    `,
  });
  const kuiper = new THREE.Points(kg, kMat);
  kg.getAttribute("position").setUsage(THREE.StaticDrawUsage);   // vị trí do shader quyết định
  scene.add(kuiper);
  kuiperBelt = { mat: kMat, n: N_K };
}

// ======================================================================
//  SAO NỀN
// ======================================================================
{
  const n = 3500, sp = new Float32Array(n * 3), sc = new Float32Array(n * 3);
  let s = 31337;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < n; i++) {
    const r = 500 + rnd() * 700;
    const th = rnd() * 6.283, ph = Math.acos(2 * rnd() - 1);
    sp[i * 3] = r * Math.sin(ph) * Math.cos(th);
    sp[i * 3 + 1] = r * Math.cos(ph);
    sp[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    const b = 0.3 + rnd() * 0.7;
    sc[i * 3] = b; sc[i * 3 + 1] = b; sc[i * 3 + 2] = b * (0.9 + rnd() * 0.2);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  sg.setAttribute("color", new THREE.BufferAttribute(sc, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({
    size: 1.6, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false,
  })));
}

// ---- Âm thanh ambient: Web Audio API, drone pad procedural (không file ngoài) ----
let audioCtx = null, ambientNodes = null;
$("ambient").addEventListener("click", () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (!ambientNodes) {
    // 3 oscillator detune nhẹ tạo drone pad + LFO điều biến gain cho "thở"
    const master = audioCtx.createGain();
    master.gain.value = 0;                     // fade-in bằng setTargetAtTime
    master.connect(audioCtx.destination);
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.07;                // chu kỳ thở ~14s
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    const oscs = [];
    [[55, "sine"], [110.5, "sine"], [164.8, "triangle"]].forEach(([f, type], i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.value = i === 2 ? 0.04 : 0.09;    // гармон higher nhỏ hơn
      o.connect(g); g.connect(master);
      o.start();
      oscs.push(o);
    });
    lfo.connect(oscs[0].frequency);            // vibrato nhẹ tầng nền
    lfo.start();
    master.gain.setTargetAtTime(0.22, audioCtx.currentTime, 1.5);   // fade-in 1.5s
    ambientNodes = { master, oscs, lfo };
  } else {
    const on = ambientNodes.master.gain.value > 0.01;
    ambientNodes.master.gain.setTargetAtTime(on ? 0 : 0.22, audioCtx.currentTime, 0.8);
  }
  const on = ambientNodes.master.gain.value > 0.01;
  $("ambient").textContent = T().audio(!on);
});

const searchInput = document.getElementById("searchInput");

function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { searchResults.style.display = "none"; return; }
  const t = T();
  const matches = PLANETS.filter(o => {
    const en = o.name.toLowerCase();
    const vi = (t.names[o.name] || "").toLowerCase();
    const zh = t.names[o.name] || "";
    return en.includes(q) || vi.includes(q) || zh.includes(q) ||
           en.replace(/\s/g, "").includes(q.replace(/\s/g, ""));
  });
  searchResults.innerHTML = "";
  if (!matches.length) {
    searchResults.innerHTML = '<div style="opacity:.5">∅</div>';
  } else {
    for (const m of matches) {
      const div = document.createElement("div");
      div.innerHTML = (t.names[m.name] || m.name) +
        '<span class="sr-sub">' + m.name + (m.dwarf ? " " + t.dwarf : "") + " · " + m.a + " AU</span>";
      div.addEventListener("click", () => {
        searchResults.style.display = "none";
        searchInput.value = "";
        flyToBody(m);
      });
      searchResults.appendChild(div);
    }
  }
  searchResults.style.display = "block";
}

  if (!sceneObj) return;
  flyTarget = { obj: sceneObj, phase: "approach", timer: 0 };
  selectPlanet(sceneObj);               // mở info panel luôn
}

// ======================================================================
//  MULTI-GALAXY — 4 thiên hà xoắn ốc nền (Points, mặc định OFF qua Settings)
// ======================================================================
let galaxyGroup = null;
function toggleGalaxies(on) {
  if (on && !galaxyGroup) buildGalaxies();
  if (galaxyGroup) galaxyGroup.visible = on;
}
function buildGalaxies() {
  galaxyGroup = new THREE.Group();
  scene.add(galaxyGroup);
  const defs = [
    { pos: [-420, 60, -520], yaw: 0.4, tilt: 0.9, size: 240 },
    { pos: [520, -40, -380], yaw: 2.2, tilt: 1.2, size: 200 },
    { pos: [-260, -80, 560], yaw: 4.0, tilt: 0.6, size: 180 },
    { pos: [480, 90, 470], yaw: 5.3, tilt: 1.0, size: 210 },
  ];
  for (const d of defs) {
    const N = 30000;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    let s = 12345 + Math.floor(d.yaw * 1000);
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    const warm = [1.0, 0.88, 0.62], cool = [0.55, 0.66, 1.0];
    for (let i = 0; i < N; i++) {
      const r = 0.03 + Math.pow(rnd(), 0.55) * 0.97;
      const arm = rnd() < 0.5 ? 0 : Math.PI;
      const spread = (rnd() - 0.5) * (0.35 + 0.25 * r);
      const ang = Math.log(r / 0.04 + 1) / 0.3 + arm + spread;
      const h = (rnd() - 0.5) * 0.06 * (1 + 2 * Math.exp(-r / 0.25));
      pos[i*3] = r * Math.cos(ang) * d.size;
      pos[i*3+1] = h * d.size;
      pos[i*3+2] = r * Math.sin(ang) * d.size;
      const t = Math.min(1, Math.max(0, (r - 0.15) / 0.85));
      const b = (rnd() ** 2 * 0.8 + 0.2) * 2.2;
      col[i*3] = (warm[0]*(1-t)+cool[0]*t) * b;
      col[i*3+1] = (warm[1]*(1-t)+cool[1]*t) * b;
      col[i*3+2] = (warm[2]*(1-t)+cool[2]*t) * b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({
      size: 1.6, vertexColors: true, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    pts.position.set(d.pos[0], d.pos[1], d.pos[2]);
    pts.rotation.set(d.tilt, d.yaw, 0.2);
    galaxyGroup.add(pts);
  }
  console.info("galaxies built: 4 x 30000 pts");
}

// ======================================================================
//  G4: AI ASSISTANT — ưu tiên server gateway (self-host), fallback key user
// ======================================================================
let aiMode = null;   // "server" | "user" | null
async function detectAI() {
  try {
    const r = await fetch("/api/health", { signal: AbortSignal.timeout(2500) });
    if (r.ok) {
      const h = await r.json();
      if (h.ok && !h.setupNeeded) {
        const me = await fetch("/api/me");
        if (me.ok) { aiMode = "server"; console.info("AI mode: server"); return; }
      }
    }
  } catch (e) { /* không có backend (Pages) — bỏ qua */ }
  // fallback: key user trong Settings (localStorage)
  const s = loadSettings();
  aiMode = (s.aiUrl && s.aiModel) ? "user" : null;
  // defensive: nếu aiMode vẫn null mà settings có đủ -> ép user mode
  if (!aiMode && s.aiUrl && s.aiModel) aiMode = "user";
  console.info("AI mode:", aiMode, "| url:", s.aiUrl || "(trống)", "| model:", s.aiModel || "(trống)");
}
function aiOpen() {
  const p = document.getElementById("aiPanel");
  p.classList.toggle("open");
  if (p.classList.contains("open")) detectAI().then(() => {
    const t = T();
    const head = document.querySelector("#aiHead .t-ai2");
    if (head) head.textContent = t.aiTitle;
    const msgs = document.getElementById("aiMsgs");
    if (!msgs.children.length) {
      msgs.innerHTML = '<div class="a">' + (aiMode
        ? (aiMode === "server" ? t.aiReadyServer : t.aiReadyUser)
        : t.aiNone) + '</div>';
    }
  });
}
document.getElementById("btnAI").addEventListener("click", aiOpen);
document.getElementById("aiClose").addEventListener("click",
  () => document.getElementById("aiPanel").classList.remove("open"));

// ---- G4.2: parse + thực thi JSON action từ AI ----
function executeAIActions(content, msgEl) {
  const m = content.match(/^\s*(\[\s*\{[\s\S]*?\}\s*\]|\{[\s\S]*?\})/m);
  if (!m) return null;
  let actions;
  try {
    const parsed = JSON.parse(m[1]);
    actions = Array.isArray(parsed) ? parsed : [parsed];
  } catch { return null; }
  const done = [];
  for (const act of actions) {
    try {
      if (act.action === "fly_to" && act.body) {
        const target = planetObjs.find(po =>
          po.data.name.toLowerCase() === String(act.body).toLowerCase());
        if (target) { flyToBody(target); done.push("fly_to " + act.body); }
      }
      else if (act.action === "set_speed" && isFinite(act.days_per_sec)) {
        const v = Math.max(-2, Math.min(3, Math.log10(Math.max(1e-3, act.days_per_sec))));
        ST.speedExp = v;
        const slider = document.getElementById("speed");
        if (slider) slider.value = v;
        done.push("speed " + act.days_per_sec + "d/s");
      }
      else if (act.action === "show_orbits") {
        ST.showOrbits = !!act.on;
        PLANETS.forEach(p => p._orbitLine && (p._orbitLine.visible = ST.showOrbits));
        document.getElementById("orbits").textContent = T().orbits(ST.showOrbits);
        done.push("orbits " + ST.showOrbits);
      }
      else if (act.action === "show_labels") {
        ST.showLabels = !!act.on;
        planetObjs.forEach(o => o.lblObj.visible = ST.showLabels);
        document.getElementById("labels").textContent = T().labels(ST.showLabels);
        done.push("labels " + ST.showLabels);
      }
    } catch (e) { console.warn("AI action lỗi:", e); }
  }
  if (done.length) console.info("AI actions:", done);
  // làm sạch: bỏ JSON action khỏi text hiển thị cho người dùng
  const cleaned = content.replace(m[0], "").trim();
  return { done, cleaned };
}

async function aiAsk(question) {
  const msgs = document.getElementById("aiMsgs");
  const q = document.createElement("div");
  q.className = "q"; q.textContent = "👤 " + question;
  msgs.appendChild(q);
  const a = document.createElement("div");
  a.className = "a"; a.textContent = "…";
  msgs.appendChild(a);
  msgs.scrollTop = msgs.scrollHeight;

  // ngữ cảnh: catalog rút gọn của thiên thể đang chọn + câu hỏi
  const t = T();
  const ctxBodies = PLANETS.map(o =>
    `${o.name} (${t.names[o.name] || ""}): a=${o.a}AU e=${o.e} T=${o.T}d` +
    ` mass=${o.info.mass}xE temp=${o.info.temp}K moons=${o.info.moons} dia=${o.info.dia}km` +
    (CATALOG_DESC[o.name.toLowerCase()] ? " — " + CATALOG_DESC[o.name.toLowerCase()][LANG] : "")
  ).join("\n");
  const sys = { role: "system", content:
    "Bạn là trợ lý thiên văn của ứng dụng mô phỏng hệ mặt trời. Trả lời ngắn gọn, chính xác, bằng ngôn ngữ '" +
    LANG + "'." + "\n\n" +
    "QUAN TRỌNG — điều khiển app: nếu người dùng yêu cầu xem/di chuyển/thay đổi tốc độ, " +
    "HÃY BẮT ĐẦU câu trả lời bằng đúng 1 dòng JSON (không thêm gì trước nó), sau đó có thể viết giải thích:" + "\n" +
    '{"action":"fly_to","body":"<id>"} — bay tới thiên thể (id = tên EN thường, vd "saturn","vesta")' + "\n" +
    '{"action":"set_speed","days_per_sec":<số>}' + "\n" +
    '{"action":"show_orbits","on":true|false}' + "\n" +
    '{"action":"show_labels","on":true|false}' + "\n" +
    "Có thể kết hợp nhiều action trong 1 JSON array. Nếu không cần hành động thì KHÔNG trả JSON." + "\n\n" +
    "Dữ liệu hiện tại:\n" + ctxBodies };

  try {
    if (aiMode === "server") {
      const r = await fetch("/api/ai/chat", { method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: [sys, { role: "user", content: question }] })});
      const j = await r.json();
      const res = j.content ? executeAIActions(j.content, a) : null;
      a.textContent = (res && res.cleaned) ? res.cleaned
                    : (j.content || ("Lỗi: " + (j.error || "unknown")));
      if (j.error) a.classList.add("err");
    } else if (aiMode === "user") {
      const s = loadSettings();
      const r = await fetch(s.aiUrl.replace(/\/$/, "") + "/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json",
                   ...(s.aiKey ? { authorization: "Bearer " + s.aiKey } : {}) },
        body: JSON.stringify({ model: s.aiModel, temperature: 0.6,
          messages: [sys, { role: "user", content: question }] })});
      const j = await r.json();
      const uc = j?.choices?.[0]?.message?.content;
      if (!j?.choices) {
        a.textContent = "Lỗi: " + (j.error?.message || "unknown");
        a.classList.add("err");
      } else {
        const res = uc ? executeAIActions(uc, a) : null;
        a.textContent = (res && res.cleaned) ? res.cleaned : (uc || "");
      }
    } else {
      a.textContent = t.aiNone;
      a.classList.add("err");
    }
  } catch (e) {
    a.textContent = "Lỗi kết nối: " + e.message;
    a.classList.add("err");
  }
  msgs.scrollTop = msgs.scrollHeight;
}
function aiSendNow() {
  const inp = document.getElementById("aiIn");
  const v = inp.value.trim();
  if (!v) return;
  inp.value = "";
  aiAsk(v);
}
document.getElementById("aiSend").addEventListener("click", aiSendNow);
document.getElementById("aiIn").addEventListener("keydown", e => {
  if (e.key === "Enter") aiSendNow();
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (!ST.paused) {
    const daysPerSec = Math.pow(10, ST.speedExp);
    ST.days += daysPerSec * dt;
    for (const o of planetObjs) {
      const pos = orbitalPosition(o.data, ST.days);
      o.grp.position.set(pos.x, pos.y, pos.z);
      // tự quay: rot = chu kỳ tự quay (ngày), âm = quay ngược (Venus, Uranus)
      o.spin.rotation.y = 2 * Math.PI * ST.days / o.data.rot;
    }
    sunUniforms.uTime.value = ST.days * 0.02;
    // hiển thị ngày/giờ lịch thực: days -> unix ms -> Date
    const dObj = new Date((ST.days + 2451545.0 - 2440587.5) * 86400000);
    $("date").textContent = dObj.toLocaleString("vi-VN", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  // ---- Phase 2: vành Saturn Keplerian — GPU (chỉ set uniform) ----
  if (saturnRing) saturnRing.mat.uniforms.uDays.value = ST.days;

  // ---- Asteroid belt — GPU (chỉ set uniform) ----
  if (asteroidBelt) asteroidBelt.mat.uniforms.uDays.value = ST.days;

  controls.update();

  // ---- Phase 3: camera bám hành tinh theo delta (không set cứng) ----
  if (followTarget) {
    const p = followTarget.grp.position;
    // giữ khoảng cách hiện tại, chỉ dịch target + camera cùng delta vị trí hành tinh
    const delta = p.clone().sub(controls.target);
    controls.target.add(delta);
    camera.position.add(delta);
  }
  // ---- G2: fly-to từ search ----
  if (flyTarget) {
    const o = flyTarget.obj;
    const p = o.grp.position;
    const offset = o.data.r * 6 + 2.5;
    const desired = new THREE.Vector3(p.x + offset, p.y + offset * 0.55, p.z + offset * 0.8);
    flyTarget.timer += dt;
    camera.position.lerp(desired, 1 - Math.exp(-2.0 * dt));
    controls.target.lerp(p, 1 - Math.exp(-2.6 * dt));
    if (flyTarget.phase === "approach" &&
        camera.position.distanceTo(desired) < 0.6 && flyTarget.timer > 1.6) {
      flyTarget.phase = "dwell"; flyTarget.timer = 0;
    }
    if (flyTarget.phase === "dwell" && flyTarget.timer > 3.0) flyTarget = null;
  }

  // ---- Tour tự động: camera bay giữa các hành tinh ----
  if (ST.tourOn && planetObjs.length) {
    const target = planetObjs[ST.tourIdx % planetObjs.length];
    const p = target.grp.position;
    // điểm ngắm: lệch lên và ra ngoài hành tinh một khoảng theo bán kính hiển thị
    const offset = target.data.r * 6 + 2.5;
    const desired = new THREE.Vector3(p.x + offset, p.y + offset * 0.55, p.z + offset * 0.8);
    ST.tourTimer += dt;
    if (ST.tourPhase === "approach") {
      // lerp mượt theo exp-decay — tốc độ không phụ thuộc framerate
      camera.position.lerp(desired, 1 - Math.exp(-1.6 * dt));
      controls.target.lerp(p, 1 - Math.exp(-2.2 * dt));
      if (camera.position.distanceTo(desired) < 0.6 && ST.tourTimer > 2.2) {
        ST.tourPhase = "dwell"; ST.tourTimer = 0;
      }
    } else {   // dwell: đứng xem hành tinh 4s (vẫn bám theo khi nó di chuyển)
      camera.position.lerp(desired, 1 - Math.exp(-0.5 * dt));
      controls.target.lerp(p, 1 - Math.exp(-0.8 * dt));
      if (ST.tourTimer > 4.0) {
        ST.tourIdx = (ST.tourIdx + 1) % planetObjs.length;
        ST.tourPhase = "approach"; ST.tourTimer = 0;
      }
    }
  }

  // ---- Vành đai Kuiper: GPU-side Kepler (chỉ set uniform thời gian) ----
  if (kuiperBelt) kuiperBelt.mat.uniforms.uDays.value = ST.days;

  // ---- Sao chổi + mưa sao băng ----
  if (cometGPU) cometGPU.mat.uniforms.uDays.value = ST.days;
  // đầu comet: 1 mesh duy nhất — cập nhật CPU (không đáng GPU hóa)
  if (cometGPU) {
    const CA = 18, CE = 0.85, CT = 365.25 * Math.pow(18, 1.5);
    const M = 6.283185 * (ST.days / CT);
    const E = solveKepler(((M % 6.283185) + 6.283185) % 6.283185, CE);
    const sc = distScale(CA) / CA;
    const inc = 25 * Math.PI / 180;
    const xO = CA * (Math.cos(E) - CE);
    const yO = CA * Math.sqrt(1 - CE * CE) * Math.sin(E);
    cometGPU.head.position.set(xO * sc, yO * Math.cos(inc), yO * Math.sin(inc));
  }
  if (meteorGPU) meteorGPU.uniforms.uTime.value = clock.elapsedTime;

  // ---- fade nhãn theo khoảng cách: hành tinh lớn 260, thiên thể nhỏ 45 ----
  // (chính sách đã chốt: 121+ nhãn chỉ hiện khi zoom gần, tránh "rừng nhãn")
  for (const o of planetObjs) {
    if (!ST.showLabels) break;
    const isMinor = o.data.dwarf || o.data.a > 2.2;
    const maxD = isMinor ? 45 : 260;
    const d = camera.position.distanceTo(o.grp.position);
    const opacity = Math.max(0, Math.min(1, (maxD - d) / (maxD * 0.4)));
    o.lblObj.visible = opacity > 0.02;
    if (o.lblObj.visible) o.lblObj.element.style.opacity = opacity.toFixed(2);
  }

  composer.render();
  labelRenderer.render(scene, camera);          // Phase 3.5: nhãn CSS2D
}
animate();
applyLang();   // khởi tạo ngôn ngữ từ localStorage
</script>
